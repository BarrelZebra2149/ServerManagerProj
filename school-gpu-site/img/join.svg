<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif" font-size="13">
<rect width="760" height="300" fill="#fff"/>
<g font-weight="bold"><text x="60" y="30">관리자(사이트)</text><text x="320" y="30">사이트(백엔드)</text><text x="590" y="30">대상 서버</text></g>
<g stroke="#999" stroke-dasharray="4"><line x1="100" y1="40" x2="100" y2="290"/><line x1="370" y1="40" x2="370" y2="290"/><line x1="640" y1="40" x2="640" y2="290"/></g>
<g stroke="#444" marker-end="url(#a)"><line x1="100" y1="64" x2="368" y2="64"/><line x1="368" y1="100" x2="102" y2="100"/><line x1="640" y1="140" x2="372" y2="140"/><line x1="372" y1="176" x2="638" y2="176"/><line x1="372" y1="212" x2="638" y2="212"/><line x1="372" y1="248" x2="638" y2="248"/></g>
<g><text x="130" y="58">① 서버 이름·사설 IP 등록</text><text x="130" y="94">② 한 줄 명령(16글자 토큰, 30분·1회)</text><text x="400" y="134">③ 서버에서 명령 실행: 에이전트 설치·등록</text><text x="400" y="170">④ SSH 인증서 신뢰 설정(CA)</text><text x="400" y="206">⑤ 승인된 관리자 계정(sudo) 생성</text><text x="400" y="242">⑥ 서버 온라인 → 웹 터미널 접속</text></g>
